<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producción Dunkin' Donuts</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .resumen-total { padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff8fb; }
    .resumen-total div { font-size: 1.5rem; font-weight: 700; margin-top: 5px; color: #e11383; }
    .filtro-consolidado input { margin-top: 5px; padding: 7px; }
    #popup-registro table, #tabla-registros table { width: 100%; border-collapse: collapse; }
    #popup-registro th, #popup-registro td, #tabla-registros th, #tabla-registros td { padding: 8px; border: 1px solid #ddd; text-align: left; }
    #popup-registro th, #tabla-registros th { background: #f4f4f4; }
    #popup-registro button, #tabla-registros button, .filtro-consolidado button { cursor: pointer; margin: 2px; }
  </style>
</head>
<body>
  <h1>Registro de Decoración de Donas</h1>
  <div id="contenedor-tabla">
    <button id="nuevoRegistroBtn">Nuevo registro</button>
    <div id="tabla-registros"></div>
  </div>
  <div id="registro-detalle"></div>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
